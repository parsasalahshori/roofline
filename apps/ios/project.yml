# The iPhone apps, one Xcode project generated by XcodeGen (`brew install xcodegen`, then `xcodegen generate` in apps/ios).
# The generated RooflineMeasure.xcodeproj is gitignored: change this file, not the project.
#
# Two apps share one source folder (RooflineMeasure/) and the RooflineCore package:
#   WinChoice        the HOMEOWNER app (the App Store app): WinChoice-branded, measures windows room by room, quote, booking.
#                    Root is the homeowner flow in RooflineMeasure/Homeowner; its brand is RooflineMeasure/Brand/WinChoice.
#   RooflineMeasure  the REP app (internal): jobs and windows on site. Its screens sit behind the STAFF_APP compile flag, which
#                    only this target sets, so they are not in the WinChoice binary at all ("parked": kept, not reachable).
#
# DEVELOPMENT_TEAM is read from the environment when the project is generated (export DEVELOPMENT_TEAM=ABCDE12345);
# scripts/testflight.sh also passes it to xcodebuild.
name: RooflineMeasure

options:
  bundleIdPrefix: com.premjeetech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # Overridden by scripts/testflight.sh with a timestamp
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    # Swift 5 language mode (Swift 6 strict concurrency would need every ARKit/RoomPlan callback audited first)
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RooflineCore:
    path: Core

targets:
  # ---------------------------------------------------------------------------------------------- the homeowner app
  WinChoice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RooflineMeasure
        excludes:
          # the rep app's own resources
          - "PrivacyInfo.xcprivacy"
          - "Info.plist"
          - "Assets.xcassets"
          # this app's plist and privacy manifest are wired below, not picked up as plain resources
          - "Brand/WinChoice/Info.plist"
          - "Brand/WinChoice/PrivacyInfo.xcprivacy"
      - path: RooflineMeasure/Brand/WinChoice/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - sdk: ARKit.framework
      - sdk: RoomPlan.framework
      - sdk: SceneKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: EventKit.framework
      - sdk: EventKitUI.framework
      - sdk: SafariServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.winchoice.measure
        PRODUCT_NAME: WinChoice
        INFOPLIST_FILE: RooflineMeasure/Brand/WinChoice/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # App tests: the homeowner store over the fake server, the HTTP client over a stub, the outbox, the brand and the bundle.
  # Hosted by the app so they can use its types with @testable import. They deliberately do NOT link RooflineCore themselves: the
  # host already contains it, and a second copy in the test bundle would make every `as? SomeCoreType` across the two disagree
  # (a thrown HomeownerAPIError would not match `catch let e as HomeownerAPIError`).
  WinChoiceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WinChoiceTests
        excludes:
          - "**/*.md"
    dependencies:
      - target: WinChoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.winchoice.measure.tests
        GENERATE_INFOPLIST_FILE: YES

  # The whole RooflineCore check suite (the pure logic of the app: sizes, wording, outbox, resume, forms, card sizing) as an XCTest,
  # in its own bundle with no host app, so a change that breaks a homeowner rule fails the WinChoice scheme too.
  WinChoiceCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WinChoiceCoreTests
        excludes:
          - "**/*.md"
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - package: RooflineCore
        product: RooflineCoreCheckSuite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.winchoice.measure.coretests
        GENERATE_INFOPLIST_FILE: YES

  # ---------------------------------------------------------------------------------------------- the rep app (parked)
  RooflineMeasure:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RooflineMeasure
        excludes:
          - "PrivacyInfo.xcprivacy"
          - "Info.plist"
          # the homeowner app and its brand are not part of the rep app
          - "Homeowner/**"
          - "Brand/**"
      - path: RooflineMeasure/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - sdk: ARKit.framework
      - sdk: RoomPlan.framework
      - sdk: SceneKit.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.roofline.measure
        PRODUCT_NAME: RooflineMeasure
        INFOPLIST_FILE: RooflineMeasure/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The rep screens (jobs, windows, outbox, sign-in, sheet photo) compile only with this flag
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STAFF_APP"

  RooflineMeasureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    # Logic tests: RooflineCore and the server-parity fixture. No host app (nothing here needs ARKit).
    sources:
      - path: RooflineMeasureTests
        excludes:
          - "**/*.md"
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - package: RooflineCore
        product: RooflineCoreCheckSuite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.roofline.measure.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WinChoice:
    build:
      targets:
        WinChoice: all
        WinChoiceTests: [test]
        WinChoiceCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WinChoiceTests
        - WinChoiceCoreTests
    archive:
      config: Release

  RooflineMeasure:
    build:
      targets:
        RooflineMeasure: all
        RooflineMeasureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RooflineMeasureTests
    archive:
      config: Release
