# Roofline Measure: the Xcode project, generated by XcodeGen (`brew install xcodegen`, then `xcodegen generate` in
# apps/ios). The generated RooflineMeasure.xcodeproj is gitignored: change this file, not the project.
#
# DEVELOPMENT_TEAM is read from the environment when the project is generated (export DEVELOPMENT_TEAM=ABCDE12345);
# scripts/testflight.sh also passes it to xcodebuild.
name: RooflineMeasure

options:
  bundleIdPrefix: com.premjeetech.roofline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # Overridden by scripts/testflight.sh with a timestamp
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
    # Swift 5 language mode (Swift 6 strict concurrency would need every ARKit/RoomPlan callback audited first)
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RooflineCore:
    path: Core

targets:
  RooflineMeasure:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RooflineMeasure
        excludes:
          - "PrivacyInfo.xcprivacy"
          - "Info.plist"
          # the homeowner app and its brand are not part of the rep app
          - "Homeowner/**"
          - "Brand/**"
      - path: RooflineMeasure/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - sdk: ARKit.framework
      - sdk: RoomPlan.framework
      - sdk: SceneKit.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.roofline.measure
        PRODUCT_NAME: RooflineMeasure
        INFOPLIST_FILE: RooflineMeasure/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The rep screens (jobs, windows, outbox, sign-in, sheet photo) compile only with this flag
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) STAFF_APP"

  RooflineMeasureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    # Logic tests: RooflineCore and the server-parity fixture. No host app (nothing here needs ARKit).
    sources:
      - path: RooflineMeasureTests
        excludes:
          - "**/*.md"
    dependencies:
      - package: RooflineCore
        product: RooflineCore
      - package: RooflineCore
        product: RooflineCoreCheckSuite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premjeetech.roofline.measure.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RooflineMeasure:
    build:
      targets:
        RooflineMeasure: all
        RooflineMeasureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RooflineMeasureTests
    archive:
      config: Release
