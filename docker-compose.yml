services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: roofline
      POSTGRES_PASSWORD: roofline
      POSTGRES_DB: roofline
    volumes:
      - roofline-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roofline -d roofline"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  roofline-db:
