name: CI

# Runs on every push and pull request. No live provider calls anywhere in CI: Twilio, Stripe,
# Google, Geocodio and Postmark are all faked in the tests (spec section 7). Nothing here needs a secret.

on:
  push:
    # Ledger, brief, report and spec/plan commits (ops/, docs/) must not start a run, because a new run cancels the
    # one in progress for the same branch.
    paths-ignore: ['ops/**', 'docs/**', 'apps/ios/**']
  # The native iPhone app (apps/ios) is Swift, built with Xcode on a Mac; nothing in this Node job checks it.
  pull_request:
    paths-ignore: ['apps/ios/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform (lint, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      # The Mac demo installer (scripts/demo-mac.sh); shellcheck is on ubuntu-latest already.
      - run: shellcheck scripts/demo-mac.sh
      # Vitest runs the packages and apps. The db and api suites start a PostGIS container with
      # Testcontainers, which uses the Docker that ubuntu-latest runners already have.
      - run: npm test

  # The v1 suite is separate: v1/ keeps its own package.json and lockfile and is not an npm
  # workspace. Locally: `cd v1 && npm ci && npm test`.
  v1:
    name: v1 (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI has no pre-installed browser: fetch the pinned version's Chromium and its system libraries.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The stack starts PostGIS with Testcontainers on the runner's Docker (amd64, native).
      - run: npm run e2e -- --project desktop --project phone
      # The demo check runs `npm run demo:reset` on its own ports (docker compose, multi-arch PostGIS), then
      # a tour of every app and each simulation (apps/web/playwright.demo.config.ts).
      - run: npx playwright test -c playwright.demo.config.ts
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The demo database on arm64 (Apple Silicon Macs): the multi-arch PostGIS image starts natively,
  # takes every migration and the Summit Ridge seed (npm run demo -- --db-only).
  demo-arm64:
    name: Demo DB (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run demo -- --db-only
      - run: docker compose -p roofline-demo -f docker-compose.demo.yml down -v

  # Python hail service (Ruling SC/SG): GDAL comes from the image's osgeo bindings; nothing Python runs on the build box.
  hail:
    name: Hail service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: roofline, POSTGRES_PASSWORD: roofline, POSTGRES_DB: roofline }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U roofline -d roofline" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate          # DATABASE_URL_OWNER defaults to 127.0.0.1:54329
      - run: >-
          docker run --rm --network host -v "$PWD:/w" -w /w/services/hail
          -e HAIL_TEST_DATABASE_URL=postgres://roofline:roofline@127.0.0.1:54329/roofline
          ghcr.io/osgeo/gdal:ubuntu-small-3.8.5
          bash -c "apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null &&
          python3 -m venv --system-site-packages /tmp/v && /tmp/v/bin/pip install -q -e '.[dev]' &&
          /tmp/v/bin/ruff check . && /tmp/v/bin/pytest -q"
      - run: docker build -t roofline-hail services/hail
