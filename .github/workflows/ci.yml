name: CI

# Runs on every push and pull request. No live provider calls anywhere in CI: Twilio, Stripe,
# Google, Geocodio and Postmark are all faked in the tests (spec section 7). Nothing here needs a secret.

on:
  push:
    # Ledger, brief and report commits (ops/) must not start a run, because a new run cancels the
    # one in progress for the same branch.
    paths-ignore: ['ops/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform (lint, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      # Vitest runs the packages and apps. The db and api suites start a PostGIS container with
      # Testcontainers, which uses the Docker that ubuntu-latest runners already have.
      - run: npm test

  # The v1 suite is separate: v1/ keeps its own package.json and lockfile and is not an npm
  # workspace. Locally: `cd v1 && npm ci && npm test`.
  v1:
    name: v1 (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v1/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI has no pre-installed browser: fetch the pinned version's Chromium and its system libraries.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The stack starts PostGIS with Testcontainers on the runner's Docker (amd64, native).
      - run: npm run e2e -- --project desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
